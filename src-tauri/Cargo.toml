[package]
name = "echow"
version = "0.7.7"
description = "Echow - discussion d'equipe en temps reel"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"
# Ouvrir un lien dans le navigateur du systeme. Sans lui, `target="_blank"` ne
# fait rien dans la vue web : les liens des messages etaient inertes.
tauri-plugin-opener = "2"

# Win32 sert a deux choses : masquer la fenetre technique du greffon d'instance
# unique, et surtout enumerer les fenetres partageables avec leur vignette —
# de quoi proposer notre propre selecteur de partage plutot que celui du moteur
# web, qu'aucune page ne peut remplacer.
[target.'cfg(windows)'.dependencies]

# La macro `implement` engendre du code qui nomme `windows_core` a la racine du
# crate : sans cette ligne, il ne s'y trouve pas. Meme version que `windows`,
# donc aucune copie supplementaire dans le binaire.
windows-core = "0.58"

windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # Etat des modificateurs pendant qu'on observe le clavier. Voir `clavier.rs`.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  # `PrintWindow`, qui fait dessiner une fenetre meme couverte. Voir `capture.rs`.
  "Win32_Storage_Xps",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  # Capture du son du systeme : WASAPI en mode bouclage. Voir `son.rs`.
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  # Le nom lisible du peripherique capture, pour le diagnostic.
  "Win32_UI_Shell_PropertiesSystem",
  # Capture par processus : tout le son du systeme sauf le notre.
  # `Win32_Security` porte SECURITY_ATTRIBUTES, exige par CreateEventW.
  "Win32_Security",
  # Parcours des processus : remonter d'une fenetre a l'application qui joue
  # reellement le son. Voir `racine_applicative` dans `son.rs`.
  "Win32_System_Diagnostics_ToolHelp",
  "implement",
  # Capture d une fenetre ou d un ecran par le processeur graphique.
  # Voir `image.rs` : c est ce qui remplace le decoupage d une capture
  # d ecran unique, et ce qui rend le second ecran atteignable.
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  # Porte les descriptions de textures, exigees par la lecture des images.
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Foundation",
] }

[profile.release]
# Taille du binaire plutot que vitesse brute : l'application passe son temps a
# attendre le reseau, pas a calculer.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
