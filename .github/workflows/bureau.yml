# Construction des applications de bureau.
#
# Un paquet macOS ne peut etre fabrique que sur macOS : la chaine de
# compilation a besoin du SDK d'Apple, que sa licence interdit de redistribuer,
# et le format `.app` est monte par des outils qui n'existent que la. Le meme
# raisonnement vaut pour Windows. On confie donc chaque paquet a une machine du
# bon systeme.
#
# Se declenche a la main — onglet « Actions » du depot, bouton « Run workflow ».

name: Applications de bureau

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  construire:
    strategy:
      # Un echec sur un systeme ne doit pas emporter les autres : mieux vaut
      # une application livree sur deux que rien du tout.
      fail-fast: false
      matrix:
        include:
          # `universal-apple-darwin` n'existe pas pour rustup : c'est une
          # notion propre a Tauri, qui compile les deux architectures d'Apple
          # puis les fusionne en un seul binaire. Il faut donc installer les
          # vraies cibles, et ne donner la pseudo-cible qu'au constructeur.
          - systeme: macos-latest
            cibles_rust: aarch64-apple-darwin,x86_64-apple-darwin
            cible: universal-apple-darwin
            nom: macOS
          - systeme: windows-latest
            cibles_rust: x86_64-pc-windows-msvc
            cible: x86_64-pc-windows-msvc
            nom: Windows

    runs-on: ${{ matrix.systeme }}
    name: ${{ matrix.nom }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cibles_rust }}

      # Le cache porte sur `target/` et le registre : sans lui, chaque
      # execution recompile Tauri et ses dependances depuis zero, soit une
      # dizaine de minutes pour rien.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ----------------------------------------------------------------------
      # Les secrets sont verifies AVANT de compiler.
      #
      # Sans eux, la construction echoue au bout de dix minutes sur un « exit
      # code 1 » qui ne dit rien : le message de Tauri se perd dans des milliers
      # de lignes de compilation Rust. Autant s'arreter tout de suite, en
      # nommant ce qui manque.
      #
      # Aucune valeur n'est affichee — seulement leur presence.
      # ----------------------------------------------------------------------
      - name: Verifier les secrets
        shell: bash
        env:
          CLE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MDP: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          PUB: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Le depot ou l'on cherche, dit a voix haute.
          #
          # Quatre secrets vides d'un coup ne sont pas quatre erreurs de copie :
          # c'est qu'ils ont ete poses ailleurs. Le plus souvent dans l'autre
          # depot, ou sous l'onglet « Dependabot » voisin, ou en secrets
          # d'environnement — que ce workflow ne lit pas.
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Les secrets doivent etre poses la, sous Settings >"
          echo "Secrets and variables > Actions > onglet Secrets,"
          echo "section « Repository secrets »."
          echo

          manquants=()
          [ -n "$CLE" ] || manquants+=("TAURI_SIGNING_PRIVATE_KEY")
          [ -n "$MDP" ] || manquants+=("TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          [ -n "$URL" ] || manquants+=("VITE_SUPABASE_URL")
          [ -n "$PUB" ] || manquants+=("VITE_SUPABASE_PUBLISHABLE_KEY")

          if [ ${#manquants[@]} -ne 0 ]; then
            echo "::error::Secrets absents ou vides : ${manquants[*]}"
            echo "Ajoutez-les dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Les quatre secrets sont presents."

          # ------------------------------------------------------------------
          # La cle est remise en forme avant usage.
          #
          # C'est une seule longue ligne de base64. Collee dans un champ de
          # formulaire, elle en ressort parfois coupee par des retours a la
          # ligne — que l'oeil ne voit pas et que le decodage, lui, refuse :
          # « Missing comment in secret key ».
          #
          # On retire donc tout ce qui n'est pas de l'alphabet base64, puis on
          # verifie que le resultat se decode bien sur le commentaire attendu.
          # Mieux vaut s'arreter ici, avec une phrase claire, qu'apres dix
          # minutes de compilation.
          # ------------------------------------------------------------------
          printf '%s' "$CLE" | tr -d '[:space:]' > cle_signature.txt

          # Le mot de passe subit le meme sort : un retour a la ligne colle avec
          # lui donnerait « Wrong password » pour une chaine qui parait
          # identique a l'oeil.
          printf '%s' "$MDP" | tr -d '[:space:]' > mdp_signature.txt

          if ! base64 -d cle_signature.txt 2>/dev/null | head -1 | grep -q 'untrusted comment'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY est illisible. Recollez le contenu de src-tauri/quality.key en une seule ligne, sans espace ni retour a la ligne."
            exit 1
          fi

          echo "MDP_PROPRE=$(cat mdp_signature.txt)" >> "$GITHUB_ENV"
          echo "Cle de signature valide."

      - run: npm ci

      # L'interface est verifiee avant d'etre empaquetee : livrer une
      # application qui ne compile pas en TypeScript n'aurait pas de sens.
      - run: npx tsc --noEmit

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises a jour. Sans elle, l'archive produite n'est pas
          # signee et l'application refusera de l'installer — c'est ce qui
          # empeche n'importe qui de pousser du code sur les postes.
          # Le fichier remis en forme a l'etape de verification, plutot que le
          # secret brut : c'est lui qui a ete valide.
          TAURI_SIGNING_PRIVATE_KEY_PATH: cle_signature.txt
          # Non vide : une chaine vide supprime la variable au lieu de la
          # vider, et Tauri ouvre alors une invite de saisie qui bloque la
          # construction sans rien afficher.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.MDP_PROPRE }}
          # Les cles de l'environnement sont necessaires a la compilation :
          # Vite les inscrit dans le paquet. Elles sont publiques par
          # construction — la cle « publishable » de Supabase est faite pour
          # etre lue par le navigateur, et les politiques RLS sont ce qui
          # protege les donnees, pas le secret de cette cle.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          args: --target ${{ matrix.cible }}
          # Une publication par version : `tauri-action` y depose les paquets
          # et le `latest.json` que l'application interroge au demarrage.
          tagName: v__VERSION__
          releaseName: Quality v__VERSION__
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.nom }}
          # `if-no-files-found: error` plutot que le defaut silencieux : une
          # archive vide se telecharge sans rien dire, et on ne s'en apercoit
          # qu'en l'ouvrant.
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.cible }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.cible }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.cible }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.cible }}/release/bundle/msi/*.msi

      # ----------------------------------------------------------------------
      # Une copie au nom fixe, pour que le lien du site ne bouge jamais.
      #
      # Les paquets portent leur version dans leur nom — `Quality_0.1.0_...` —
      # donc une adresse directe casse a chaque publication. GitHub sait servir
      # `releases/latest/download/<nom>`, mais seulement si le nom est stable.
      # On depose donc un second exemplaire, sans version.
      # ----------------------------------------------------------------------
      - name: Copie au nom fixe
        if: matrix.nom == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          paquet=$(ls src-tauri/target/${{ matrix.cible }}/release/bundle/nsis/*-setup.exe | head -1)
          cp "$paquet" Quality-setup.exe
          etiquette=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          gh release upload "$etiquette" Quality-setup.exe --clobber
