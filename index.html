<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Echow</title>
    <meta
      name="description"
      content="Echow - la discussion d'equipe en temps reel, avec des fils qui se referment et une recherche qui trouve."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6366f1" />

    <!--
      La carte que montrent Discord, iMessage et les autres quand on colle un
      lien Echow.

      Sans ces lignes, une invitation collee dans une conversation n'etait
      qu'une adresse nue : `echows.vercel.app/invite/9f2c…`. Rien ne disait a
      qui la recevait de quoi il s'agissait, et un lien qu'on ne reconnait pas
      ne se clique pas.

      L'image est absolue et non relative : les robots qui la lisent ne
      resolvent pas toujours un chemin, et une carte sans vignette ressemble a
      une erreur.

      Le titre reste le meme sur toutes les pages — l'application est servie par
      un seul fichier, et le serveur ne sait pas quel salon on demande. Dire
      « Echow » a coup sur vaut mieux que promettre le nom du salon et se
      tromper.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Echow" />
    <meta property="og:title" content="Echow" />
    <meta
      property="og:description"
      content="La discussion d'equipe en temps reel : salons ecrits, vocal en pair-a-pair et partage d'ecran."
    />
    <meta property="og:url" content="https://echows.vercel.app" />
    <meta property="og:image" content="https://echows.vercel.app/icons/icon-512.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!--
      Les emojis, en police plutot qu'en images.

      Sur Windows, c'est « Segoe UI Emoji » qui repond : un dessin plat, gris et
      anguleux que personne n'aime. Les emojis d'Apple sont sous licence et ne
      peuvent pas etre redistribues — les embarquer reviendrait a diffuser leur
      oeuvre. « Noto Color Emoji » est libre, rond et colore, et c'est le jeu le
      plus proche de ce qu'on cherche.

      Chargee en ligne, pas embarquee : c'est ce qui change tout par rapport au
      raisonnement precedent, qui l'ecartait pour son poids. Google Fonts la
      decoupe en dix morceaux par plage de caracteres, et le navigateur ne
      telecharge que ceux des emojis reellement affiches — quelques centaines de
      kilo-octets, mis en cache ensuite. L'installateur, lui, ne grossit pas
      d'un octet.

      `display=swap` : le texte parait tout de suite, les emojis se remplacent
      quand la police arrive. Sans lui, une liste de messages resterait blanche
      le temps du telechargement.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap"
    />

    <!--
      L'icone de l'onglet porte son fond violet.

      `app-icon.png` est la version sans fond : elle sert dans l'application,
      posee sur un theme qu'on choisit. Dans un onglet on ne choisit rien — la
      barre est blanche chez la plupart des gens, et un dessin lavande clair sur
      blanc disparait presque entierement. Le carre violet, lui, se voit sur les
      deux.

      Le `.ico` suit, pour ce qui ne lit pas la premiere ligne : les favoris de
      Windows, quelques agregateurs, et le vieux fond de l'internet qui va
      chercher `/favicon.ico` sans rien demander a personne.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!--
      Ce qu'iOS demande pour poser l'application sur l'ecran d'accueil.

      Safari ignore le manifeste sur ces trois points : il lui faut son propre
      lien d'icone, et sans `apple-mobile-web-app-capable` l'application
      s'ouvre dans le navigateur, barre d'adresse comprise — ce qui donne une
      page web posee sur l'ecran d'accueil, pas une application.

      `viewport-fit=cover` est deja pose plus haut ; c'est lui qui laisse le
      fond passer sous l'encoche, et les marges de securite sont reprises dans
      la feuille de style.
    -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Echow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <!--
      Ecran de chargement, ecrit directement dans la page.

      Il s'affiche avant meme que le paquet JavaScript soit telecharge : c'est
      tout son interet. Le construire en React reviendrait a montrer une
      fenetre blanche pendant le temps qu'il cherche a couvrir — sur le client
      de bureau, ce vide est particulierement visible au lancement.

      Les couleurs sont ecrites en dur : les jetons de theme vivent dans une
      feuille qui n'est pas encore chargee a cet instant.
    -->
    <div id="splash" role="status" aria-live="polite">
      <div class="splash__mark" aria-hidden="true">
        <img src="/app-icon.png" alt="Echow" width="168" height="168" />
      </div>
      <p class="splash__name">Echow</p>
      <div class="splash__bar" aria-hidden="true"><span></span></div>
      <p class="splash__hint">Chargement…</p>
    </div>

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(50rem 34rem at 15% -10%, rgba(88, 101, 242, 0.22), transparent 62%),
          radial-gradient(42rem 30rem at 100% 108%, rgba(235, 69, 158, 0.16), transparent 62%),
          #0f0f12;
        color: #f2f3f5;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 260ms ease-out;
      }

      @media (prefers-color-scheme: light) {
        #splash {
          background:
            radial-gradient(50rem 34rem at 15% -10%, rgba(88, 101, 242, 0.1), transparent 62%),
            #f2f3f5;
          color: #060607;
        }
      }

      #splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      /*
       * Le logo, en grand et sans fond.
       *
       * Aucune pastille derriere lui : l'image porte deja sa forme, et
       * l'enfermer dans un carre colore revenait a lui en ajouter une seconde.
       */
      /*
       * Cent soixante-huit pixels, c'etait une affiche.
       *
       * Un ecran de chargement n'est pas une page d'accueil : il dure une
       * seconde ou deux, et son logo ne sert qu'a dire « c'est bien Echow qui
       * demarre ». A cette taille il occupait le tiers de la fenetre et faisait
       * paraitre l'attente plus longue qu'elle ne l'est — un grand objet qui
       * tourne se regarde, un petit se remarque et s'oublie.
       */
      .splash__mark {
        width: 64px;
        height: 64px;
      }

      .splash__mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        /* Une rotation lente et reguliere : assez pour dire que quelque chose
           travaille, assez lente pour ne pas donner le tournis a qui attend
           quinze secondes sur une liaison lente. */
        animation: splash-tourne 2.8s linear infinite;
      }

      @keyframes splash-tourne {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      .splash__name {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* Une barre qui va et vient, plutot qu'un pourcentage : on ne sait pas
         combien de temps cela va prendre, et un faux pourcentage ment. */
      .splash__bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: rgba(128, 132, 142, 0.24);
        overflow: hidden;
      }

      .splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #5865f2, #eb459e);
        animation: splash-slide 1.15s ease-in-out infinite;
      }

      @keyframes splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }

      .splash__hint {
        margin: 0;
        font-size: 13px;
        opacity: 0.62;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__bar span { animation: none; width: 100%; }
        .splash__mark img { animation: none; }
        #splash { transition: none; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
